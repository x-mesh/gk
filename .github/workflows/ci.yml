name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Matrix must satisfy the `go 1.25.0` directive in go.mod.
        go: ['1.25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race -cover
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      # Pinned on purpose: `latest` moved v2.12.2 -> v2.13.1 mid-release, and the
      # newer binary embeds go1.27's gofmt, which aligns map literals differently.
      # Bump this deliberately and reformat with the matching Go release.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      # The E2E package is intentionally build-tagged out of the default test
      # run because it compiles and drives the real binary against temp repos.
      - run: go test -tags e2e ./internal/e2e/ -count=1 -v
